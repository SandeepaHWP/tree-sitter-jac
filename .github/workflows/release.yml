name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g tree-sitter-cli@0.22.6
          JAC_VERSION="$(cat .jaclang-version)"
          curl -fsSL "https://raw.githubusercontent.com/jaseci-labs/jaseci/v${JAC_VERSION}/scripts/install.sh" \
            | bash -s -- --version "${JAC_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build parser
        run: |
          jac run grammar.jac
          tree-sitter generate --no-bindings src/grammar.json

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src/parser.c
            src/grammar.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
