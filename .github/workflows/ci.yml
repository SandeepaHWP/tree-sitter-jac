name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g tree-sitter-cli@0.22.6
          JAC_VERSION="$(cat .jaclang-version)"
          curl -fsSL "https://raw.githubusercontent.com/jaseci-labs/jaseci/v${JAC_VERSION}/scripts/install.sh" \
            | bash -s -- --version "${JAC_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check jac.spec snapshot
        run: |
          jac tool grammar -o "$RUNNER_TEMP/jac.spec"
          diff -u jac.spec.snapshot "$RUNNER_TEMP/jac.spec"

      - name: Build parser
        run: |
          jac run grammar.jac
          tree-sitter generate --no-bindings src/grammar.json

      - name: Run corpus tests
        run: tree-sitter test

      - name: Parse examples
        run: bash test/parse-clean.sh examples/sample.jac
